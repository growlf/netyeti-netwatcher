name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release & push Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/netyeti-netwatcher:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/netyeti-netwatcher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          name: "NetWatch AI ${{ github.ref_name }}"
          body: |
            ## Docker Image

            Pull the latest image from GitHub Container Registry:
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/netyeti-netwatcher:${{ github.ref_name }}
            ```

            ## Getting Started

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for setup instructions.
