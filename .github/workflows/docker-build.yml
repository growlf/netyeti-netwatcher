name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/agent/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/netyeti-netwatcher:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
