[defaults]
# Point to our mounted inventory
inventory = /app/config/inventory.yml

# Disable host key checking so network automation doesn't hang on unknown SSH keys
host_key_checking = False

# Don't create .retry files when hosts fail
retry_files_enabled = False

# Use a cleaner output format
stdout_callback = yaml

[ssh_connection]
ssh_args = -F /dev/null -o ControlMaster=auto -o ControlPersist=60s
