services:
  victoria:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: netwatch_victoria
    ports:
      - "${VICTORIA_PORT:-8428}:8428"
    volumes:
      - ./vm-data:/storage
      - ./config/prometheus.yml:/prometheus.yml:ro
    restart: unless-stopped
    command:
      - "--storageDataPath=/storage"
      - "--promscrape.config=/prometheus.yml"

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: netwatch_chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - ./chroma-data:/chroma/chroma
    restart: unless-stopped

  # kuzu_explorer is intentionally disabled. KuzuDB only allows a single
  # process to open the database at a time; running the explorer alongside the
  # agent causes "Could not set lock on file" errors in the agent.
  # To browse the graph data, stop the agent first and then run the explorer
  # manually:
  #   docker run -p 8001:8000 -v ./kuzu-data/netwatch.kuzu:/database:ro \
  #     -e MODE=READ_ONLY kuzudb/explorer:0.8.2

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: netwatch_litellm
    network_mode: host
    volumes:
      - ./config/litellm_config.yml:/app/config.yaml:ro
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: src/agent/Dockerfile
    container_name: netwatch_agent
    network_mode: host
    ports:
      - "${AGENT_PORT:-8085}:8085"
    volumes:
      - ./config:/app/config
      - ./kuzu-data:/data
      - ${HOST_SSH_DIR:-~/.ssh}:/root/.ssh:ro
    restart: unless-stopped
    environment:
      - COLLECTION_INTERVAL_SECONDS=${COLLECTION_INTERVAL_SECONDS:-3600}
      - ANSIBLE_CONFIG=/app/config/ansible.cfg
      - AUTO_DISCOVERY=${AUTO_DISCOVERY:-true}
      - ROUTER_WAN_IP=${ROUTER_WAN_IP:-}
      - TRACEROUTE_TARGET=${TRACEROUTE_TARGET:-8.8.8.8}
