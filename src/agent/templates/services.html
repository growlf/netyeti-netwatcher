<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch Services</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <nav class="glass-panel mb-8 flex justify-between items-center px-6 py-4 shadow-xl">
            <div class="flex items-center gap-6">
                <a href="/" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Dashboard
                </a>
                <div class="h-6 w-px bg-slate-700"></div>
                <h1 class="text-xl font-bold text-white">Services on {{ ip }}</h1>
            </div>
        </nav>

        <div class="glass-panel p-6 shadow-xl">
            <h2 class="text-lg font-bold text-slate-300 mb-6 border-b border-slate-700 pb-2">Detected Services</h2>
            
            {% if services %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {% for service in services %}
                <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700 flex items-center justify-between">
                    <div>
                        <div class="font-bold text-white mb-1">{{ service.name }}</div>
                        <div class="text-xs text-slate-400 font-mono">Port: {{ service.port }}</div>
                    </div>
                    <a href="{{ service.url }}" target="_blank" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded text-sm font-medium shadow transition-colors flex items-center gap-2">
                        Open Service
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="text-center py-12 text-slate-400">
                <svg class="w-12 h-12 mx-auto text-slate-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p>No managed web services detected on this endpoint.</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
